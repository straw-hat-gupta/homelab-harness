name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Lets release.yml require a passing test run before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.7.4"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Placeholder values only; no test talks to a real provider.
      SECRET_KEY: ci-only-not-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_JWT_SECRET: ci-only-jwt-secret-0123456789abcdef
      SUPABASE_DB_PW: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_SSLMODE: disable
      OPENAI_KEY: sk-ci-placeholder
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate a throwaway credential encryption key
        run: |
          echo "CREDENTIAL_ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
      - name: Django system checks
        run: python manage.py check
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python manage.py test --noinput -v 2 2>&1 | tee test-output.txt; exit "${PIPESTATUS[0]}"
      - name: Test summary
        if: always()
        run: |
          {
            echo "### Test results"
            grep -E '^(Ran [0-9]+ tests|OK|FAILED)' test-output.txt || echo "No summary found"
          } >> "$GITHUB_STEP_SUMMARY"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history for committed secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            git /repo --no-banner --redact --verbose

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: agentic-assistant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image boots Django
        run: |
          docker run --rm --entrypoint python \
            -e SECRET_KEY=ci -e ALLOWED_HOSTS=localhost \
            -e SUPABASE_URL=https://example.supabase.co -e SUPABASE_JWT_SECRET=ci \
            -e SUPABASE_DB_PW=x -e POSTGRES_HOST=localhost -e POSTGRES_DB=x -e POSTGRES_USER=x \
            -e OPENAI_KEY=x -e GOOGLE_CLIENT_ID=x -e GOOGLE_CLIENT_SECRET=x \
            agentic-assistant:ci manage.py check
