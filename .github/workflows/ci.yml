name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Lets release.yml require a passing run before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.7.10"
  UV_FROZEN: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check .
      - name: pyright (strict)
        run: uv run pyright

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync
      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing:skip-covered

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "uv==${UV_VERSION}"
      - name: Known vulnerabilities in the locked dependencies (R-26)
        run: |
          uv export --no-dev --all-packages --no-emit-workspace --no-hashes -o runtime-requirements.txt
          uvx pip-audit --strict -r runtime-requirements.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: homelab-harness:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image serves /healthz as a non-root, read-only container
        run: |
          docker run -d --name hh --read-only --tmpfs /tmp --cap-drop ALL -p 8080:8080 homelab-harness:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          docker logs hh; exit 1

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Relative links in Markdown resolve
        run: python scripts/check_links.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan history for committed secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            git /repo --no-banner --redact --verbose
