name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Lets release.yml require a passing run before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.7.10"
  UV_FROZEN: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check .
      - name: pyright (strict)
        run: uv run pyright

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync
      # The database tests start Postgres 17 with testcontainers on the runner's
      # Docker; with CI set they fail rather than skip if Docker is missing. They
      # include the migration round trip and an `alembic check` drift test.
      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing:skip-covered

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "uv==${UV_VERSION}"
      - name: Known vulnerabilities in the locked dependencies (R-26)
        run: |
          uv export --no-dev --all-packages --no-emit-workspace --no-hashes -o runtime-requirements.txt
          uvx pip-audit --strict -r runtime-requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"
      - run: npm install --global --no-fund --no-audit pnpm@12.16.1
      # Only what ships in the image's UI bundle; high and critical fail the job.
      - name: Known vulnerabilities in the UI's production dependencies
        working-directory: ui
        run: pnpm audit --prod --audit-level high

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # uv exports the OpenAPI document for the types check and serves the
      # build for the Playwright smoke test.
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync
      - uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"
      - run: npm install --global --no-fund --no-audit pnpm@12.16.1
      - run: pnpm install --frozen-lockfile
      - name: lint (eslint, prettier)
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: vitest
        run: pnpm test
      - name: build
        run: pnpm build
      - name: Generated files are up to date (API types, route tree)
        run: |
          pnpm gen:api
          git diff --exit-code -- src/api/schema.gen.ts src/routeTree.gen.ts
      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright smoke (the harness serves the build; API from fixtures)
        run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: ui/test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Both ways: the default stack must not need the observability variables.
      - name: Compose file is valid
        run: |
          HH_POSTGRES_PASSWORD=ci-placeholder docker compose -f deploy/compose.yaml config -q
          HH_POSTGRES_PASSWORD=ci-placeholder HH_GRAFANA_ADMIN_PASSWORD=ci-placeholder \
            docker compose -f deploy/compose.yaml --profile observability config -q
      - name: Grafana dashboards are valid JSON
        run: for f in deploy/grafana/dashboards/*.json; do python3 -m json.tool "$f" > /dev/null || exit 1; done
      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: homelab-harness:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image serves /healthz as a non-root, read-only container
        run: |
          docker run -d --name hh --read-only --tmpfs /tmp --cap-drop ALL -p 8080:8080 homelab-harness:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          docker logs hh; exit 1

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Relative links in Markdown resolve
        run: python scripts/check_links.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan history for committed secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            git /repo --no-banner --redact --verbose
