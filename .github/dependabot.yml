version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The image must run the Python version CI tests (requires-python, pyright,
      # setup-python). Minor/major Python upgrades are a deliberate PR that moves
      # CI, the lock target and the image together; patch updates stay automatic.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
