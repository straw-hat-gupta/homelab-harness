[project]
name = "homelab-harness-cli"
version = "0.1.0"
description = "hh: the owner's command line for homelab-harness."
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "typer>=0.15",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
]

[project.scripts]
hh = "homelab_harness_cli.main:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_harness_cli"]
