[project]
name = "homelab-harness"
version = "0.1.0"
description = "Stage 1A: bounded Claude Agent SDK fixture proof"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk==0.2.187",
    "mcp==2.3.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.6", "pyright==1.1.414", "pip-audit>=2.9,<3"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["homelab_harness", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
