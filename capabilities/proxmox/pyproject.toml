[project]
name = "homelab-harness-proxmox"
version = "0.1.0"
description = "Proxmox VE capability for homelab-harness: typed read-only adapter and token bootstrap."
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "homelab-harness-sdk",
    "httpx>=0.28",
    "pydantic>=2.9",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_harness_proxmox"]
