[project]
name = "homelab-harness"
version = "0.1.0"
description = "AI control plane for Proxmox home labs: MCP tools, plans, approvals, durable jobs."
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "homelab-harness-sdk",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.1,<3",
    "psycopg[binary]>=3.3,<4",
    "alembic>=1.20,<2",
    "dbos>=3.4,<4",
    "mcp>=2.3,<3",
    "cryptography>=44",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "httpx>=0.28",
    "webauthn>=3.0.1,<4",
]

[project.scripts]
homelab-harness = "homelab_harness.server:main"
homelab-harness-migrate = "homelab_harness.db.migrate:main"
homelab-harness-token = "homelab_harness.mcp.token_cli:main"
homelab-harness-owner = "homelab_harness.auth.owner_cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_harness"]
