[project]
name = "homelab-harness"
version = "0.1.0"
description = "AI control plane for Proxmox home labs: MCP tools, plans, approvals, durable jobs."
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "homelab-harness-sdk",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
]

[project.scripts]
homelab-harness = "homelab_harness.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_harness"]
