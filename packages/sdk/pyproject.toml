[project]
name = "homelab-harness-sdk"
version = "0.1.0"
description = "Capability contract for homelab-harness: shared errors, tiers and retry classes."
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_harness_sdk"]
